name: Build and release packages

# Pushing a v* tag builds the RPM, DEB and Pacman packages and attaches them to
# a release for that tag. workflow_dispatch runs the same builds without
# publishing, which is useful for checking a change before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  rpm:
    name: RPM (EL${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: almalinux:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        # EL9 is the oldest release with everything the build needs, and its
        # packages install on EL10 and on Fedora as well.
        distro: ['9']
    steps:
      # The container images are minimal, so git has to exist before checkout.
      # The checkout is owned by the runner user while the steps run as root,
      # so git also has to be told to accept it.
      - name: Install git
        run: |
          dnf install -y git tar gzip
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False rpm-build dnf-plugins-core
          # CodeReady Builder carries rpcgen and several of the -devel packages.
          dnf config-manager --set-enabled crb
          dnf builddep -y packaging/rpm/open-vm-tools-wayland.spec
      # Gtkmm 4 and libei are not in EL9. The build takes them when they are
      # there, so ask for them and carry on if the release does not have them.
      - name: Install optional build dependencies
        run: |
          for p in gtkmm4.0-devel libei-devel; do
            dnf install -y --setopt=install_weak_deps=False "$p" \
              || echo "optional dependency $p is not available on this release"
          done
      - name: Build packages
        run: packaging/rpm/build.sh "$PWD/dist/rpm"
      - name: Verify package metadata
        run: |
          for f in dist/rpm/*.rpm; do
            echo "=== $(basename "$f")"
            rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\n' "$f"
            echo "-- provides:";  rpm -qp --provides  "$f" | grep -E '^open-vm-tools' || true
            echo "-- obsoletes:"; rpm -qp --obsoletes "$f"
            echo "-- conflicts:"; rpm -qp --conflicts "$f"
          done
          echo "=== portal entry"
          rpm -qpl dist/rpm/*desktop*.rpm | grep -E 'applications/|vmusr' || true
      - uses: actions/upload-artifact@v5
        with:
          name: rpm-el${{ matrix.distro }}
          path: dist/rpm/*.rpm
          if-no-files-found: error

  deb:
    name: DEB (${{ matrix.tag }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 is the oldest release with everything the build needs: Gtkmm 4
          # arrives in 24.04, and libfuse3 3.10, which the fuse3 check requires,
          # in 22.04. Its packages install on 24.04 and 26.04 as well.
          - image: ubuntu:22.04
            tag: ubuntu2204
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates tar gzip
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
      - name: Install packaging tools
        run: apt-get install -y --no-install-recommends devscripts equivs fakeroot
      # Gtkmm 4 and libei are not in 22.04. The build takes them when they are
      # there, so ask for them and carry on if the release does not have them.
      - name: Install optional build dependencies
        run: |
          for p in libgtkmm-4.0-dev libei-dev; do
            apt-get install -y --no-install-recommends "$p" \
              || echo "optional dependency $p is not available on this release"
          done
      # The tag lands in the package version, so builds for several
      # distributions get distinct names on the release page.
      - name: Build packages
        env:
          OVT_DEB_TAG: ${{ matrix.tag }}
        run: packaging/debian/build.sh "$PWD/dist/deb"
      - name: Verify package metadata
        run: |
          for f in dist/deb/*.deb; do
            echo "=== $(basename "$f")"
            dpkg-deb -f "$f" Package Version Architecture Provides Conflicts Replaces
          done
          echo "=== portal entry"
          dpkg-deb -c dist/deb/open-vm-tools-wayland-desktop_*.deb \
            | grep -E 'applications/|vmusr|vmware-user' || true
      - uses: actions/upload-artifact@v5
        with:
          name: deb-${{ matrix.tag }}
          path: dist/deb/*.deb
          if-no-files-found: error

  arch:
    name: Pacman (Arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install git
        run: |
          pacman -Syu --noconfirm --needed git
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
      - name: Build packages
        run: packaging/arch/build.sh "$PWD/dist/arch"
      - name: Verify package metadata
        run: |
          for f in dist/arch/*.pkg.tar.zst; do
            echo "=== $(basename "$f")"
            pacman -Qip "$f"
          done
          echo "=== portal entry"
          bsdtar -tf dist/arch/*desktop*.pkg.tar.zst \
            | grep -E 'applications/|vmusr|vmware-user' || true
      - uses: actions/upload-artifact@v5
        with:
          name: arch
          path: dist/arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish release
    needs: [rpm, deb, arch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          # This job has no checkout, so name the repository rather than
          # letting gh go looking for a git remote.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --title "open-vm-tools-wayland $TAG" \
              --generate-notes \
              --verify-tag
          fi
